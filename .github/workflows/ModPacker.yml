name: 模組翻譯打包流程

on:
  workflow_dispatch:
    inputs:
      modpack_version:
        description: "適用的模組包版本"
        required: false
        type: string
        default: "v1.0"
      tag:
        description: "發布版本，例如 v1.0（預設為 alpha）"
        required: false
        type: string
        default: "alpha"
      per_release:
        description: "預先發布版"
        type: boolean
      no_release:
        description: "停用發布，將只會產生工作流程成品，並忽略掉發布階段"
        type: boolean

permissions:
  contents: write

jobs:
  Validate:
    name: 驗證專案
    uses: TeamKugimiya/reusable-workflows/.github/workflows/Modpack-Validate.yml@main
    with:
      strict: true
    secrets:
      toolkit_token: ${{ secrets.TOOLKIT_TOKEN }}

  Build:
    name: 打包補丁與資源包
    needs: [ Validate ]
    uses: TeamKugimiya/reusable-workflows/.github/workflows/Modpack-Build.yml@main
    with:
      build_target: all
    secrets:
      toolkit_token: ${{ secrets.TOOLKIT_TOKEN }}

  Release-It:
    name: 發布階段
    if: ${{ !inputs.no_release }}
    needs: [ Build ]
    uses: TeamKugimiya/reusable-workflows/.github/workflows/Modpack-Release.yml@main
    with:
      artifact_pattern: ${{ needs.Build.outputs.artifact_pattern }}
      version: ${{ inputs.tag }}
      release_name: ${{ format('FTB StoneBlock 4 {0} 中文化補丁 {1}', inputs.modpack_version, inputs.tag) }}
      prerelease: ${{ inputs.per_release }}
